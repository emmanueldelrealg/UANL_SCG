<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Navy background circle -->
  <circle cx="32" cy="32" r="32" fill="#1e3a5f"/>
  <!-- Gold ledger/book shape -->
  <rect x="14" y="18" width="22" height="28" rx="2" fill="#f5c842" opacity="0.9"/>
  <rect x="18" y="22" width="14" height="2" rx="1" fill="#1e3a5f"/>
  <rect x="18" y="27" width="14" height="2" rx="1" fill="#1e3a5f"/>
  <rect x="18" y="32" width="10" height="2" rx="1" fill="#1e3a5f"/>
  <rect x="18" y="37" width="14" height="2" rx="1" fill="#1e3a5f"/>
  <!-- Gold vertical balance line -->
  <rect x="38" y="20" width="2" height="26" rx="1" fill="#f5c842"/>
  <!-- Left pan -->
  <line x1="30" y1="22" x2="39" y2="22" stroke="#f5c842" stroke-width="1.5"/>
  <rect x="31" y="24" width="7" height="4" rx="1" fill="#f5c842" opacity="0.7"/>
  <!-- Right pan -->
  <line x1="39" y1="32" x2="48" y2="32" stroke="#f5c842" stroke-width="1.5"/>
  <rect x="40" y="34" width="7" height="4" rx="1" fill="#f5c842" opacity="0.7"/>
</svg>
